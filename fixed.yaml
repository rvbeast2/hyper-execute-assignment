version: 0.1
runson: win

autosplit: true
concurrency: 1   #conCurrency changed to concurrency 

runtime:
  language: java #added runtime and language key
  version: 11

env: 
  TOKEN: anvdegtod-asdaasda0asda-asda #nested keys can't be on the same line as the parent key, so moved to next line
  ENVIRONMENT: staging #added a new env variable

pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve  #added a new pre step to resolve dependencies before running tests
  - echo $env:ENVIRONMENT   #added a new pre step to print the value of the ENVIRONMENT variablez

testDiscovery:
  type: raw
  mode: remote  #mode changed from dynamic to remote
  command: grep 'test name' xml/testng_win.xml | awk '{print$2}' | sed 's/name=//g' | sed 's/\x3e//g'

testRunnerCommand: mvn test `-Dplatname=win `-Dmaven.repo.local=./.m2 dependency:resolve `-DselectedTests=$test

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, win, v1, autosplit]